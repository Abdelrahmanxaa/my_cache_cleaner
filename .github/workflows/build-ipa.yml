name: Build IPA

# Manual only: nothing runs on push. GitHub → Actions → Build IPA → Run workflow.
on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the host regression tests (sets WQ_SKIP_PREFLIGHT=1)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Build WQFiles.ipa
        env:
          WQ_SKIP_PREFLIGHT: ${{ inputs.skip_tests && '1' || '0' }}
        run: bash build.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WQFiles-ipa
          path: WQFiles.ipa
          if-no-files-found: error

      # Keeps every build as a GitHub Release (tag build-<run number>), so the
      # IPA can be downloaded with a plain link once the repository is public.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" WQFiles.ipa \
            --repo "${{ github.repository }}" \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}"
